name: Feature Request
description: Suggest a new feature
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the feature
      placeholder: What feature would you like to see?
    validations:
      required: true
  
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed?
      placeholder: What problem does this solve?
    validations:
      required: true
  
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: How would you implement this?
    validations:
      required: false
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions?
      placeholder: Are there other ways to solve this?
    validations:
      required: false
